steps:
# ────────── 1. BUILD ──────────
- name: gcr.io/cloud-builders/docker
  env:
  - NPM_CONFIG_LEGACY_PEER_DEPS=true
  args:
  - build
  - -t
  - gcr.io/$PROJECT_ID/highlaunchpad:$COMMIT_SHA

  # ---- build-args (each one is its own list item) ----
  - --build-arg
  - NEXT_PUBLIC_FIREBASE_API_KEY=$_NEXT_PUBLIC_FIREBASE_API_KEY
  - --build-arg
  - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  - --build-arg
  - NEXT_PUBLIC_FIREBASE_PROJECT_ID=$_NEXT_PUBLIC_FIREBASE_PROJECT_ID
  - --build-arg
  - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
  - --build-arg
  - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  - --build-arg
  - NEXT_PUBLIC_FIREBASE_APP_ID=$_NEXT_PUBLIC_FIREBASE_APP_ID
  - --build-arg
  - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
  - --build-arg
  - NEXT_PUBLIC_STRIPE_PRO_PRICE_ID=$_NEXT_PUBLIC_STRIPE_PRO_PRICE_ID
  - --build-arg
  - NEXT_PUBLIC_STRIPE_BILLING_PORTAL_URL=$_NEXT_PUBLIC_STRIPE_BILLING_PORTAL_URL
  - --build-arg
  - NEXT_PUBLIC_BASE_URL=$_NEXT_PUBLIC_BASE_URL
  - --build-arg
  - STRIPE_SECRET_KEY=$_STRIPE_SECRET_KEY
  - --build-arg
  - STRIPE_WEBHOOK_SECRET=$_STRIPE_WEBHOOK_SECRET

  # ---- finally the build context (dot) ----
  - .

# ────────── 2. PUSH ──────────
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - gcr.io/$PROJECT_ID/highlaunchpad:$COMMIT_SHA

# ────────── 3. DEPLOY ──────────
- name: gcr.io/cloud-builders/gcloud
  args:
  - run
  - deploy
  - highlaunchpad
  - --image=gcr.io/$PROJECT_ID/highlaunchpad:$COMMIT_SHA
  - --region=us-central1
  - --platform=managed
  - --allow-unauthenticated
  - --port=3000
  - --update-secrets=FIREBASE_SERVICE_ACCOUNT=firebase-service-key:latest
  - --update-env-vars=NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY,NEXT_PUBLIC_BASE_URL=$_NEXT_PUBLIC_BASE_URL,FACEBOOK_CLIENT_ID=$_FACEBOOK_CLIENT_ID,FACEBOOK_CLIENT_SECRET=$_FACEBOOK_CLIENT_SECRET,INSTAGRAM_CLIENT_ID=$_FACEBOOK_CLIENT_ID,INSTAGRAM_CLIENT_SECRET=$_FACEBOOK_CLIENT_SECRET,TWITTER_CLIENT_ID=$_TWITTER_CLIENT_ID,TWITTER_CLIENT_SECRET=$_TWITTER_CLIENT_SECRET,LINKEDIN_CLIENT_ID=$_LINKEDIN_CLIENT_ID,LINKEDIN_CLIENT_SECRET=$_LINKEDIN_CLIENT_SECRET,STRIPE_SECRET_KEY=$_STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET=$_STRIPE_WEBHOOK_SECRET,FACEBOOK_WEBHOOK_VERIFY_TOKEN=$_FACEBOOK_WEBHOOK_VERIFY_TOKEN

images:
- gcr.io/$PROJECT_ID/highlaunchpad:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY